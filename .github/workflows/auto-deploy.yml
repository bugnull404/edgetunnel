name: Auto Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  schedule:
    # 上游 Upstream Sync 每天 00:00 UTC 合并，这里 00:30 部署最新的 main
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 仓库无 package.json，wrangler-action 会退回 runner 预装的旧 wrangler 并误报
      # workers.dev 未注册，所以这里直接显式装 4.x 再部署。
      - name: Install wrangler
        run: npm install --no-fund --no-audit --no-save wrangler@4

      # 上游的 wrangler.toml 把 kv_namespaces 注释掉了，这里只改工作副本、不提交，
      # 避免和 Upstream Sync 冲突；每次部署都带上绑定，面板配置才不会丢。
      - name: Bind KV namespace
        env:
          KV_ID: ${{ vars.KV_ID }}
        run: |
          if [ -n "$KV_ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "KV"\nid = "%s"\n' "$KV_ID" >> wrangler.toml
            tail -4 wrangler.toml
          else
            echo "::warning::仓库变量 KV_ID 未设置，本次部署不含 KV 绑定"
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: npx wrangler deploy --name "${WORKER_NAME:-edgetunnel}"
