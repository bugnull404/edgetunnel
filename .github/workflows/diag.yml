on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production paths
        run: |
          for u in \
            "https://edgetunnel.yaoyan6632.workers.dev/admin" \
            "https://edgetunnel.yaoyan6632.workers.dev/login" \
            "https://edgetunnel.yaoyan6632.workers.dev/" ; do
            echo "=== $u"
            curl -sS -m 20 -o body.txt -w "http=%{http_code} redirect=%{redirect_url}\n" "$u" || echo "curl failed rc=$?"
