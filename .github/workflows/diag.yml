name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temp workers and probe KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for w in edt-fix-b edt-hello2 edt-w2 edt-w3 edt-w4 edt-w5 edt-c1 edt-c2 edt-c3; do
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w?force=true" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('worker', '$w', 'deleted' if d['success'] else d['errors'])"
          done
          curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/f576d93ce8304710913a785a78579428" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('kv probe', 'deleted' if d['success'] else d['errors'])"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=50" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('remaining:', [x['id'] for x in d['result']])"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=50" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('kv remaining:', [(x['id'],x.get('title')) for x in d['result']])"
