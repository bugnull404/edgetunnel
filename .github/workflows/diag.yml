name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: e2e vless with correct uuid (ip and domain)
        run: |
          set -eu
          echo "=== sub first link"
          curl -sS -m 15 "https://edgetunnel.yaoyan6632.workers.dev/sub?token=a97f97da22b988655fad7a76cb0f83dc" -o sub.txt
          python3 -c "import base64; d=open('sub.txt','rb').read().strip()
          try: t=base64.b64decode(d).decode()
          except Exception: t=d.decode()
          ls=t.splitlines(); print('lines:', len(ls)); print(ls[0][:260] if ls else 'EMPTY')"
          curl -sSL -o v2ray.zip -m 120 https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-linux-64.zip
          unzip -q -o v2ray.zip -d v2core
          mkcfg() {
            cat > client.json <<EOF
          {
            "log": { "loglevel": "info" },
            "inbounds": [ { "port": 10808, "protocol": "socks", "settings": { "udp": false } } ],
            "outbounds": [ {
              "protocol": "vless",
              "settings": { "vnext": [ { "address": "$1", "port": 443, "users": [ { "id": "05d6358c-9db6-4a82-8248-1cb6489e8046", "encryption": "none" } ] } ] },
              "streamSettings": {
                "network": "ws", "security": "tls",
                "tlsSettings": { "serverName": "edgetunnel.yaoyan6632.workers.dev" },
                "wsSettings": { "path": "/?ed=2560", "headers": { "Host": "edgetunnel.yaoyan6632.workers.dev" } }
              }
            } ]
          }
          EOF
          }
          for target in 104.16.0.1 edgetunnel.yaoyan6632.workers.dev; do
            echo "=== e2e via $target"
            mkcfg "$target"
            ./v2core/v2ray run -c client.json > v2ray.log 2>&1 &
            VPID=$!
            sleep 3
            curl -sS -m 20 -x socks5://127.0.0.1:10808 -o /dev/null -w "google204: http=%{http_code} time=%{time_total}\n" https://www.google.com/generate_204 || echo "e2e FAILED rc=$?"
            kill $VPID 2>/dev/null || true
            sleep 1
          done
          grep -iE "error|failed|rejected" v2ray.log | tail -6 || true
