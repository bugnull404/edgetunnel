name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live worker over public internet (no CF API, no token)
        run: |
          for P in /admin /login /; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://edgetunnel.yaoyan6632.workers.dev${P}" || echo "curl_failed")
            echo "GET ${P} -> ${CODE}"
          done
          echo "--- headers of /admin ---"
          curl -sSI --max-time 20 "https://edgetunnel.yaoyan6632.workers.dev/admin" \
            | grep -iE '^(HTTP|location|server|cf-ray|content-type)' || true

      - name: Probe token validity once (single call, avoid auth-failure lockout)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          curl -sS -H "$AUTH" https://api.cloudflare.com/client/v4/user/tokens/verify \
          | jq -c '{status: .result.status, errors}'

      - name: Registry-side NS for bugnull.fun
        run: |
          curl -sS "https://cloudflare-dns.com/dns-query?name=bugnull.fun&type=NS" \
            -H 'accept: application/dns-json' \
          | jq -c '{Status, Answer}'
          echo "--- SOA ---"
          curl -sS "https://cloudflare-dns.com/dns-query?name=bugnull.fun&type=SOA" \
            -H 'accept: application/dns-json' \
          | jq -c '{Status, Answer}'
