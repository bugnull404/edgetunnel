name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Re-put ADMIN secret on edgetunnel and probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu
          npm install --no-fund --no-audit --no-save --prefix "${RUNNER_TEMP}/tools" wrangler@4
          WR="${RUNNER_TEMP}/tools/node_modules/.bin/wrangler"
          D="${RUNNER_TEMP}/secput"; rm -rf "$D"; mkdir -p "$D"
          printf 'export default { fetch() { return new Response("x"); } };\n' > "$D/_worker.js"
          printf 'name = "edgetunnel"\nmain = "_worker.js"\nno_bundle = true\ncompatibility_date = "2025-11-04"\n' > "$D/wrangler.toml"
          (cd "$D" && printf '%s' "$ADMIN_PASSWORD" | "$WR" secret put ADMIN)
          for u in \
            "https://edgetunnel.yaoyan6632.workers.dev/admin" \
            "https://edgetunnel.yaoyan6632.workers.dev/" \
            "https://edgetunnel.yaoyan6632.workers.dev/xyz123" ; do
            echo "=== $u"
            curl -sS -m 20 -o body.txt -w "http=%{http_code}\n" "$u" || echo "curl failed rc=$?"
            head -c 300 body.txt; echo; echo "---"
          done
