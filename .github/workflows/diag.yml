name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Add bugnull.fun as a Cloudflare zone and report its NS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DOMAIN=bugnull.fun
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"

          echo "=== 1. existing zone? ==="
          ZONES=$(curl -sS -H "$AUTH" "${API}/zones?name=${DOMAIN}")
          echo "$ZONES" | jq -c '{success, count: (.result|length), errors}'
          ZONE_ID=$(echo "$ZONES" | jq -r '.result[0].id // empty')

          if [ -z "$ZONE_ID" ]; then
            echo "=== 2. creating zone ==="
            CREATED=$(curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"name\":\"${DOMAIN}\",\"account\":{\"id\":\"${CF_ACCOUNT_ID}\"},\"type\":\"full\"}" \
              "${API}/zones")
            echo "$CREATED" | jq -c '{success, errors, id: .result.id, status: .result.status}'
            ZONE_ID=$(echo "$CREATED" | jq -r '.result.id // empty')
          fi

          echo "=== 3. zone detail ==="
          if [ -n "$ZONE_ID" ]; then
            echo "zone_id=${ZONE_ID}"
            curl -sS -H "$AUTH" "${API}/zones/${ZONE_ID}" \
            | jq -r '.result | "name=\(.name) status=\(.status) plan=\(.plan.name)", "NAME_SERVERS:", (.name_servers[] | "  \(.)")'
          else
            echo "no zone_id obtained"
          fi
