name: Diag (temporary, delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed artifact of edgetunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/edgetunnel" \
            -o deployed.raw
          ls -la deployed.raw
          python3 - <<'PY'
          import re
          raw = open('deployed.raw','rb').read()
          parts = re.findall(rb'filename="([^"]+)"', raw)
          print("PARTS:", [p.decode() for p in parts])
          body = raw.split(b'\r\n\r\n',1)[1] if b'\r\n\r\n' in raw else raw
          js = body
          print("has DIAG-START:", b'DIAG-START' in js)
          print("count 'export default':", js.count(b'export default'))
          print("count 'const __inner':", js.count(b'const __inner'))
          lines = js.split(b'\n')
          for i,l in enumerate(lines[:20],1):
              print(i, l[:60])
          PY
